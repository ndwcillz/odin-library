<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="scripts.js" defer></script>

    <button id="newBook">New Book</button>

    <div id="formContainer" class="formOverlay">
        <div class="form-card">
            <button id="closeForm">&times;</button>

            <h2>Book Information</h2>
            <form>
                <label for="title">Title: </label>
                <input type="text" id="title" required>

                <label for="author">Author: </label>
                <input type="text" id="author" required>

                <label for="pgNum">Number of Pages: </label>
                <input type="number" id="pgNum" required>

                <label for="read">Have you Read?</label>
                <input type="checkbox" id="read" required>

                <button type="submit">Submit</button>
            </form>
        
        
        </div>
    
    
    
    
    </div>

    <div id="card-container"></div>
</body>
</html>
